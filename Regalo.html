  <script src="menu.js"></script>
  <script>
    const abrirAlias = document.getElementById('abrirAlias');
    const cerrarAlias = document.getElementById('cerrarAlias');
    const modalAlias = document.getElementById('miModal');

    if (abrirAlias && cerrarAlias && modalAlias) {
      abrirAlias.addEventListener('click', () => {
        modalAlias.classList.add('is-visible');
      });

      cerrarAlias.addEventListener('click', () => {
        modalAlias.classList.remove('is-visible');
      });

      modalAlias.addEventListener('click', (event) => {
        if (event.target === modalAlias) {
          modalAlias.classList.remove('is-visible');
        }
      });
    }
  </script>
